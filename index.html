<!doctype html>
<html lang="pt" class="dark">
  <head>
    <!-- Prevenir Cache (Impede Ecrã Preto após Updates) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MartMarket - Plataforma Global de Produtos Digitais & Criadores</title>
    <meta name="description" content="Infraestrutura internacional para criação, venda, distribuição de produtos digitais, cursos, ebooks, área de membros e rede de afiliados." />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MartMarket" />

    <!-- Open Graph / SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MartMarket - Global Digital Creator Platform" />
    <meta property="og:description" content="Venda cursos, ebooks, templates e crie sua área de membros com pagamentos multimoeda e afiliados." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
    <!-- Auto-Recuperação de ChunkLoadError -->
    <script>
      window.addEventListener('error', function(e) {
        // Deteta falha no carregamento de módulos (assets apagados na Vercel)
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Importing a module script failed'))) {
          console.warn('Detetada versão desatualizada. A forçar atualização...');
          if (!sessionStorage.getItem('reloaded_once')) {
            sessionStorage.setItem('reloaded_once', 'true');
            // Unregister service workers just in case before reloading
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (let reg of regs) reg.unregister();
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }
      });
      // Limpa a flag se a página carregou com sucesso
      window.addEventListener('load', function() {
        setTimeout(() => sessionStorage.removeItem('reloaded_once'), 2000);
      });
    </script>

  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
